name: Dev Container

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - Makefile
      - parksapi-entrypoint.sh
      - .dockerignore
      - .github/workflows/dev_container.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - Makefile
      - parksapi-entrypoint.sh
      - .dockerignore
      - .github/workflows/dev_container.yml

jobs:
  dev-container:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Shell files are LF
      run: |
        for f in parksapi-entrypoint.sh Dockerfile Makefile; do
          if grep -qU $'\r' "$f"; then echo "CRLF in $f"; exit 1; fi
        done

    - name: Build image
      run: make build

    - name: Entrypoint creates .env and stamps the lockfile
      run: |
        rm -f .env
        make list
        test -f .env
        test "$(cat node_modules/.parksapi-deps)" = "$(sha256sum package-lock.json | cut -d' ' -f1)"

    - name: Nothing root-owned in the tree
      run: |
        found=$(find . -path ./.git -prune -o -uid 0 -print | head)
        test -z "$found" || { echo "$found"; exit 1; }

    - name: Test suite in-container
      # --retry=1: traceContextPropagation.test.ts calls httpbin.org, and this
      # job runs alongside Unit Test, so both hit that endpoint at once. A
      # genuinely broken test still fails both attempts.
      run: make test ARGS="--retry=1"

    - name: make clean removes containers and networks
      run: |
        make clean
        test -z "$(docker ps -aq --filter name=parksapi)"

    - name: No local-only files in the image
      run: |
        # Tag it here: compose derives the name from the project and `make
        # clean` has already removed the containers it could be read from.
        docker build -t parksapi-imagecheck .
        docker run --rm --entrypoint sh parksapi-imagecheck -c '
          find /app \( -name "*.har" -o -name ".env" -o -name "cache.sqlite" -o -name "settings.local.json" \) -print > /tmp/found
          test ! -s /tmp/found'
